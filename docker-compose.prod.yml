# Production overrides: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
#
# Differences from the default compose file:
#   * database and cache are not published on the host
#   * API runs multiple uvicorn workers behind the container port
#   * explicit resource limits and log rotation

services:
  postgres:
    ports: []
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    environment:
      # Set API_KEYS=key:tenant,... in the shell/.env before exposing this.
      AUTH_MODE: ${AUTH_MODE:-api-key}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  worker:
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
