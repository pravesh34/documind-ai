[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind-api"
version = "1.0.0"
description = "DocuMind AI — production-grade LangGraph RAG service with free/local AI providers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "langchain>=0.3.14",
  "langchain-core>=0.3.29",
  "langchain-text-splitters>=0.3.5",
  "langchain-ollama>=0.2.2",
  "langchain-google-genai>=2.0.5",
  "langchain-groq>=0.2.3",
  "langchain-openai>=0.3.0",
  "langchain-huggingface>=0.1.2",
  "langgraph>=0.2.60",
  "pypdf>=5.1.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "redis>=5.2.1",
  "slowapi>=0.1.9",
  "structlog>=24.4.0",
  "prometheus-fastapi-instrumentator>=7.0.2",
  "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.4",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prose-heavy modules: corpus excerpts and prompt templates are long by nature.
"app/services/seed_data.py" = ["E501"]
"app/rag/prompts.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
# PostgreSQL-only modules need a live database/Redis, so they are exercised by
# integration environments rather than the unit/contract suite.
omit = [
  "app/workers/celery_app.py",
  "app/repositories/postgres.py",
  "app/db/session.py",
  "app/db/init_db.py",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
