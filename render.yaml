# DocuMind AI — Render blueprint. Deploy with:
# https://dashboard.render.com/blueprints -> New -> New Blueprint Instance ->
# connect this repository.

services:
  # API on the free web tier. Sleeping instances rebuild the deterministic
  # seed corpus in-memory on cold start, so the service self-heals.
  - type: web
    name: documind-api
    runtime: python
    rootDir: backend
    plan: free
    # Frontend is hosted on Vercel; the API only needs the Python backend.
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: >
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      # Format: key:tenant,default  (production requires API_KEYS)
      - key: API_KEYS
        generateValue: true
      # Comma-separated origins; put your Vercel URL here, e.g.
      # https://documind-ai.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Free tier: deterministic embeddings + extractive answers (no keys).
      # Switch both to `auto` plus a GEMINI_API_KEY/HF token for real AI.
      - key: LLM_PROVIDER
        value: none
      - key: EMBEDDING_PROVIDER
        value: deterministic
      - key: METRICS_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_CHAT
        value: "20/minute"
      - key: WEB_CONCURRENCY
        value: "1"

# Free Postgres (0.1 CPU / 256 MB). NOTE: Render's free PostgreSQL expires
# after 30 days; when it does, delete this database AND the DATABASE_URL env
# var (or paste a longer-lived free Postgres such as Neon / Supabase as
# DATABASE_URL) and add ALLOW_MEMORY_BACKEND=true so the API boots with the
# in-memory backend under ENVIRONMENT=production.
databases:
  - name: documind-db
    plan: free
    databaseName: documind
    user: documind
