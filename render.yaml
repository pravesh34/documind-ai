# DocuMind AI — Render blueprint. Deploy with:
# https://dashboard.render.com/blueprints -> New -> New Blueprint Instance ->
# connect this repository.

services:
  # API on the free web tier. Sleeping instances rebuild the deterministic
  # seed corpus in-memory on cold start, so the service self-heals.
  - type: web
    name: documind-api
    runtime: python
    rootDir: backend
    plan: free
    # Frontend is hosted on Vercel; the API only needs the Python backend.
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: >
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      # Format: key:tenant,default  (production requires API_KEYS)
      - key: API_KEYS
        generateValue: true
      # Comma-separated origins; put your Vercel URL here, e.g.
      # https://documind-ai.vercel.app,https://documind-ai-*.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Free tier: deterministic embeddings + extractive answers (no keys).
      # Switch both to `auto` plus a GEMINI_API_KEY/HF token for real AI.
      - key: LLM_PROVIDER
        value: none
      - key: EMBEDDING_PROVIDER
        value: deterministic
      - key: METRICS_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_CHAT
        value: "20/minute"

  # Optional-but-recommended persistent store. NOTE: Render's free PostgreSQL
  # expires after 30 days; when it does, delete this database service AND the
  # DATABASE_URL env var (or paste a longer-lived free Postgres such as Neon /
  # Supabase as DATABASE_URL) and the API falls back to the in-memory backend.
  - type: pgsql
    name: documind-db
    plan: free
    databaseName: documind
    user: documind
